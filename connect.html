<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connect With Phomar Systems</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .form-box{
      position:relative;
      width:100%;
      max-width:550px;
      background:#fff;
      border-radius:15px;
      padding:35px;
      box-shadow:0 15px 35px rgba(0,0,0,.25);
    }

    /* Close Button */
    .close-btn{
      position:absolute;
      top:15px;
      right:18px;

      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#f1f5f9;
      color:#334155;

      border:none;
      border-radius:50%;

      font-size:22px;
      line-height:1;

      cursor:pointer;
      transition:0.3s;
    }

    .close-btn:hover{
      background:#e2e8f0;
      color:#dc2626;
      transform:rotate(90deg);
    }

    h2{
      text-align:center;
      color:#0f172a;
      margin-bottom:10px;
      padding-right:25px;
    }

    .subtitle{
      text-align:center;
      color:#666;
      margin-bottom:10px;
    }

    .contact-email{
      text-align:center;
      margin-bottom:25px;
      font-size:14px;
      color:#2563eb;
      font-weight:600;
    }

    .input-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
      color:#333;
    }

    input,
    textarea{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    input:focus,
    textarea:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.15);
    }

    textarea{
      resize:none;
      height:120px;
    }

    .send-btn{
      width:100%;
      padding:15px;

      background:#2563eb;
      color:#fff;

      border:none;
      border-radius:8px;

      font-size:16px;
      font-weight:bold;

      cursor:pointer;
      transition:.3s;
    }

    .send-btn:hover{
      background:#1d4ed8;
    }

    #result{
      margin-top:15px;
      text-align:center;
      font-weight:bold;
    }

    @media(max-width:600px){
      .form-box{
        padding:28px 20px;
      }

      h2{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

<div class="form-box">

  <!-- Close Button -->
  <button
    type="button"
    class="close-btn"
    onclick="window.location.href='index.html'"
    aria-label="Close">
    &times;
  </button>

  <h2>Connect With Phomar</h2>

  <p class="subtitle">
    Fill your details and we'll contact you soon.
  </p>

  <p class="contact-email">
    phomarinfo@gmail.com
  </p>

  <form id="contactForm">

    <div class="input-group">
      <label>Full Name</label>
      <input
        type="text"
        name="from_name"
        placeholder="Enter your name"
        required>
    </div>

    <div class="input-group">
      <label>Email</label>
      <input
        type="email"
        name="from_email"
        placeholder="Enter your email"
        required>
    </div>

    <div class="input-group">
      <label>Phone Number</label>
      <input
        type="tel"
        name="phone"
        placeholder="Enter your phone number"
        required>
    </div>

    <div class="input-group">
      <label>Message</label>
      <textarea
        name="message"
        placeholder="Write your message..."
        required></textarea>
    </div>

    <button type="submit" class="send-btn">
      Send Message
    </button>

    <p id="result"></p>

  </form>

</div>


<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init({
  publicKey: "6xIMLcJyjuK8KxklS"
});

const form = document.getElementById("contactForm");
const result = document.getElementById("result");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  result.innerHTML = "Sending...";
  result.style.color = "#2563eb";

  try {

    await emailjs.sendForm(
      "service_jzj9hnm",
      "template_7pb7hsq",
      form
    );

    result.innerHTML = "✅ Message sent successfully!";
    result.style.color = "green";

    form.reset();

  } catch (err) {

    console.log(err);

    result.innerHTML =
      "❌ " + (err.text || "Failed to send message.");

    result.style.color = "red";
  }

});

</script>

</body>
</html>
